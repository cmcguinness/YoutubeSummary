<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} &middot; YouTube Summarizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">
<nav class="navbar navbar-expand-lg border-bottom bg-body-tertiary">
    <div class="container">
        {# Keep the two brand links together, with or without the logout button #}
        <div class="d-flex align-items-center gap-3">
            <a href="https://launch.ai-applets.com" class="navbar-brand brand-color m-0">AI&nbsp;Applets</a>
            <a class="navbar-brand fw-semibold m-0" href="{{ url_for('index_page') }}">YouTube Summarizer</a>
        </div>
        {% if session.get('authenticated') and not auth_disabled %}
            <form action="{{ url_for('logout') }}" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button class="btn btn-sm btn-outline-secondary" type="submit">Log out</button>
            </form>
        {% endif %}
    </div>
</nav>
<main class="container flex-grow-1 py-4">
    {% block content %}{% endblock %}
</main>
</body>
</html>
